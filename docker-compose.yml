version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - FACE_DB_DIR=/app/data/face_db
      - SQL_DB=/app/data/attendance.db
      - MODEL_PACK=buffalo_sc
      - SIM_THRESHOLD=0.4
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
